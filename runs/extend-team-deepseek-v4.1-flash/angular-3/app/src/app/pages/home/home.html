<h1 class="page-title">Pokémon</h1>

<form class="filters" role="search" (submit)="$event.preventDefault()">
  <div class="field filters__search">
    <label for="search">Search</label>
    <input
      id="search"
      type="search"
      autocomplete="off"
      [value]="searchText()"
      (input)="onSearch($any($event.target).value)"
    />
  </div>
  <div class="field">
    <label for="type">Type</label>
    <select id="type" (change)="onFilter('type', $any($event.target).value)">
      <option value="" [selected]="!type()">All types</option>
      @for (t of vm().types; track t.name) {
        <option [value]="t.name" [selected]="t.name === type()">{{ t.label }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="generation">Generation</label>
    <select id="generation" (change)="onFilter('generation', $any($event.target).value)">
      <option value="" [selected]="!generation()">All generations</option>
      @for (g of vm().generations; track g.name) {
        <option [value]="g.name" [selected]="g.name === generation()">{{ g.label }}</option>
      }
    </select>
  </div>
</form>

@if (count()) {
  <p class="count" aria-live="polite">{{ count() }} Pokémon</p>
  <ul class="card-grid">
    @for (p of results(); track p.id; let i = $index) {
      <li>
        <app-pokemon-card [id]="p.id" [name]="p.name" [types]="p.typeRefs" [priority]="i < 6" />
      </li>
    }
  </ul>
  <nav class="pagination" aria-label="Pagination">
    @if (page() > 1) {
      <a routerLink="/" [queryParams]="pageParams(page() - 1)" queryParamsHandling="merge">Previous page</a>
    }
    <span>Page {{ page() }} of {{ pageCount() }}</span>
    @if (page() < pageCount()) {
      <a routerLink="/" [queryParams]="pageParams(page() + 1)" queryParamsHandling="merge">Next page</a>
    }
  </nav>
} @else {
  <p class="count" aria-live="polite">No Pokémon found</p>
}
