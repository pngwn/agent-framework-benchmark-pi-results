<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
    <script>
      // While the app hydrates, interactions with the primary controls are
      // captured and replayed once hydration is done, so no input is lost.
      (function () {
        var pending = [];
        var done = false;
        var selector = 'button[data-sort], select[data-game], input[data-search]';
        function capture(event) {
          if (done) return;
          var target = event.target;
          if (!target || typeof target.closest !== 'function') return;
          if (!target.closest(selector)) return;
          event.preventDefault();
          event.stopPropagation();
          pending.push({ type: event.type, target: target, value: target.value });
        }
        document.addEventListener('click', capture, true);
        document.addEventListener('change', capture, true);
        document.addEventListener('input', capture, true);
        window.__pokedexHydrationDone = function () {
          if (done) return;
          done = true;
          var events = pending;
          pending = [];
          for (var i = 0; i < events.length; i++) {
            var item = events[i];
            if (item.value !== undefined) item.target.value = item.value;
            item.target.dispatchEvent(new Event(item.type, { bubbles: true, cancelable: true }));
          }
        };
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
