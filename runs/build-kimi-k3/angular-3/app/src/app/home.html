<h1>Pokémon</h1>

<form class="controls" (submit)="$event.preventDefault()">
  <div class="field field-search">
    <label for="search">Search</label>
    <input
      #search
      id="search"
      type="search"
      [attr.value]="initialQuery"
      (input)="onSearch($event)"
      autocomplete="off"
    />
  </div>
  <div class="field">
    <label for="type">Type</label>
    <select #typeSelect id="type" (change)="onType($event)">
      <option value="" [attr.selected]="filters().type === '' ? '' : null">All types</option>
      @for (type of data().types; track type.name) {
        <option [value]="type.name" [attr.selected]="filters().type === type.name ? '' : null">{{ type.en }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="generation">Generation</label>
    <select #generationSelect id="generation" (change)="onGeneration($event)">
      <option value="" [attr.selected]="filters().generation === '' ? '' : null">All generations</option>
      @for (generation of data().generations; track generation.name) {
        <option [value]="generation.name" [attr.selected]="filters().generation === generation.name ? '' : null">
          {{ generation.en }}
        </option>
      }
    </select>
  </div>
</form>

<p class="count">{{ filtered().length }} Pokémon</p>

@if (filtered().length) {
  <ul class="cards">
    @for (species of pageItems(); track species.id) {
      <li
        app-pokemon-card
        [id]="species.id"
        [speciesName]="species.name"
        [name]="humanize(species.name)"
        [types]="cardTypes(species.id)"
      ></li>
    }
  </ul>

  <div class="pagination">
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    @if (page() > 1) {
      <a [routerLink]="[]" [queryParams]="pageQuery(page() - 1)">Previous page</a>
    }
    @if (page() < totalPages()) {
      <a [routerLink]="[]" [queryParams]="pageQuery(page() + 1)">Next page</a>
    }
  </div>
} @else {
  <p>No Pokémon found</p>
}
