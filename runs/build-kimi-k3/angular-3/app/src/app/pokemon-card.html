<a class="card-link" [routerLink]="['/pokemon', speciesName()]">
  <img [src]="sprite()" alt="" width="96" height="96" loading="lazy" />
  <span class="dex">{{ dex() }}</span>
  <span class="name">{{ name() }}</span>
  @if (types(); as cardTypes) {
    <span class="type-badges">
      @for (type of cardTypes; track type.name) {
        <span class="type-badge" [style.background]="'var(--type-' + type.name + ')'">{{ type.en }}</span>
      }
    </span>
  }
</a>
@if (hidden()) {
  <span class="hidden-note">Hidden ability</span>
}
