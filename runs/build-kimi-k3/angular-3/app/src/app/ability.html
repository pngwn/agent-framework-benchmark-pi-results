@if (vm(); as vm) {
  <h1>{{ vm.title }}</h1>

  <section class="section-card" aria-labelledby="effect-heading">
    <h2 id="effect-heading">Effect</h2>
    <p class="effect-text">{{ vm.effect }}</p>
  </section>

  <section class="section-card" aria-labelledby="pokemon-heading">
    <h2 id="pokemon-heading">Pokémon</h2>
    <p class="count">{{ vm.learners.length }} Pokémon</p>
    <ul class="cards">
      @for (learner of vm.learners; track learner.id) {
        <li
          app-pokemon-card
          [id]="learner.id"
          [speciesName]="learner.name"
          [name]="humanize(learner.name)"
          [hidden]="learner.hidden"
        ></li>
      }
    </ul>
  </section>
} @else {
  <app-not-found-view />
}
