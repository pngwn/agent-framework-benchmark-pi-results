<h1>Pokémon</h1>

<form class="controls" (submit)="$event.preventDefault()">
  <div class="field field-search">
    <label for="search">Search</label>
    <input id="search" type="search" [value]="q()" (input)="onSearch($event)" autocomplete="off" />
  </div>
  <div class="field">
    <label for="type">Type</label>
    <select id="type" (change)="onTypeChange($event)">
      <option value="" [selected]="type() === ''">All types</option>
      @for (t of types(); track t.name) {
        <option [value]="t.name" [selected]="type() === t.name">{{ t.enName }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="generation">Generation</label>
    <select id="generation" (change)="onGenerationChange($event)">
      <option value="" [selected]="generation() === ''">All generations</option>
      @for (g of generations(); track g.name) {
        <option [value]="g.name" [selected]="generation() === g.name">{{ g.enName }}</option>
      }
    </select>
  </div>
</form>

<p class="count">{{ total() }} Pokémon</p>

@if (loaded() && total() === 0) {
  <p>No Pokémon found</p>
} @else {
  <app-pokemon-cards [cards]="items()" />
  <div class="pagination">
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    @if (page() > 1) {
      <a [routerLink]="[]" [queryParams]="pageQuery(page() - 1)" queryParamsHandling="merge">Previous page</a>
    }
    @if (page() < totalPages()) {
      <a [routerLink]="[]" [queryParams]="pageQuery(page() + 1)" queryParamsHandling="merge">Next page</a>
    }
  </div>
}
