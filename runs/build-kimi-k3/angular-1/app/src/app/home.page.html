<h1>Pokémon</h1>

<form class="filters" (submit)="$event.preventDefault()">
  <div class="field field-search">
    <label for="search">Search</label>
    <input id="search" type="search" name="q" autocomplete="off" value="{{ q() }}" [attr.readonly]="ready() ? null : ''" (input)="onSearch($event)" />
  </div>
  <div class="field">
    <label for="type">Type</label>
    <select id="type" [disabled]="!ready()" (change)="onTypeChange($event)">
      <option value="" [selected]="!type()">All types</option>
      @for (t of data().types; track t.name) {
        <option [value]="t.name" [selected]="type() === t.name">{{ t.english }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="generation">Generation</label>
    <select id="generation" [disabled]="!ready()" (change)="onGenerationChange($event)">
      <option value="" [selected]="!generation()">All generations</option>
      @for (g of data().generations; track g.name) {
        <option [value]="g.name" [selected]="generation() === g.name">{{ g.english }}</option>
      }
    </select>
  </div>
</form>

<p class="result-count">{{ filtered().length }} Pokémon</p>

@if (filtered().length === 0) {
  <p>No Pokémon found</p>
} @else {
  <app-pokemon-cards [cards]="pageItems()" [showTypes]="true" />
}

<p class="pagination">
  <span class="page-status">Page {{ currentPage() }} of {{ totalPages() }}</span>
  @if (currentPage() > 1) {
    <a [routerLink]="['/']" [queryParams]="pageParams(currentPage() - 1)">Previous page</a>
  }
  @if (currentPage() < totalPages()) {
    <a [routerLink]="['/']" [queryParams]="pageParams(currentPage() + 1)">Next page</a>
  }
</p>
