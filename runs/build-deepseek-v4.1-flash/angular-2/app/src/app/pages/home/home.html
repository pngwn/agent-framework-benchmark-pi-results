<h1>Pokémon</h1>

<div class="filters">
  <div class="field search-field">
    <label for="search">Search</label>
    <input
      id="search"
      name="search"
      type="search"
      autocomplete="off"
      [value]="q()"
      (input)="onSearch($event)"
    />
  </div>

  <div class="field">
    <label for="type-filter">Type</label>
    <select id="type-filter" name="type" (change)="onTypeChange($event)">
      <option value="" [selected]="type() === ''">All types</option>
      @for (typeOption of data()?.types ?? []; track typeOption.name) {
        <option [value]="typeOption.name" [selected]="typeOption.name === type()">{{ typeOption.label }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="generation-filter">Generation</label>
    <select
      id="generation-filter"
      name="generation"
      (change)="onGenerationChange($event)"
    >
      <option value="" [selected]="generation() === ''">All generations</option>
      @for (generationOption of data()?.generations ?? []; track generationOption.name) {
        <option [value]="generationOption.name" [selected]="generationOption.name === generation()">{{ generationOption.label }}</option>
      }
    </select>
  </div>
</div>

@if (data()) {
  <p class="count-text results-count">{{ count() }} Pokémon</p>

  @if (count() > 0) {
    <ul class="card-grid">
      @for (entry of pageSpecies(); track entry.id) {
        <li
          app-pokemon-card
          [speciesName]="entry.name"
          [dexId]="entry.id"
          [types]="typesFor(entry.id)"
        ></li>
      }
    </ul>

    <div class="pagination">
      <span>Page {{ currentPage() }} of {{ totalPages() }}</span>
      @if (currentPage() > 1) {
        <a routerLink="/" [queryParams]="pageQuery(currentPage() - 1)">Previous page</a>
      }
      @if (currentPage() < totalPages()) {
        <a routerLink="/" [queryParams]="pageQuery(currentPage() + 1)">Next page</a>
      }
    </div>
  } @else {
    <p class="no-results">No Pokémon found</p>
  }
}
