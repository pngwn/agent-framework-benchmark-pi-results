@if (notFound()) {
  <app-not-found-content />
} @else if (ability()) {
  <h1>{{ name() }}</h1>

  <section class="panel" aria-labelledby="effect-heading">
    <h2 id="effect-heading">Effect</h2>
    <p>{{ effect() }}</p>
  </section>

  <section class="panel" aria-labelledby="pokemon-heading">
    <h2 id="pokemon-heading">Pokémon</h2>
    <p class="count-text">{{ pokemon().length }} Pokémon</p>

    <ul class="card-grid">
      @for (entry of pokemon(); track entry.species.id) {
        <li
          app-pokemon-card
          [speciesName]="entry.species.name"
          [dexId]="entry.species.id"
          [hidden]="entry.hidden"
        ></li>
      }
    </ul>
  </section>
}
