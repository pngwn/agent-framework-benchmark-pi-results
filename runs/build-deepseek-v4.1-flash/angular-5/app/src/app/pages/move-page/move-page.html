<main class="page">
  @if (pageData(); as move) {
    <h1 class="page-title">{{ move.displayName }}</h1>

    <div class="facts-card">
      <dl class="facts-list">
        <div>
          <dt>Type</dt>
          <dd>
            <a
              [class]="'type-badge badge--' + move.type.name"
              [routerLink]="['/types', move.type.name]"
            >
              {{ move.type.displayName }}
            </a>
          </dd>
        </div>
        <div>
          <dt>Category</dt>
          <dd>{{ move.category }}</dd>
        </div>
        <div>
          <dt>Power</dt>
          <dd>{{ move.power ?? '—' }}</dd>
        </div>
        <div>
          <dt>Accuracy</dt>
          <dd>{{ move.accuracy ?? '—' }}</dd>
        </div>
        <div>
          <dt>PP</dt>
          <dd>{{ move.pp ?? '—' }}</dd>
        </div>
      </dl>
    </div>

    <section class="panel" aria-labelledby="effect-heading">
      <h2 id="effect-heading">Effect</h2>
      <p>{{ move.effect }}</p>
    </section>

    <section class="panel" aria-labelledby="learned-by-heading">
      <h2 id="learned-by-heading">Learned by</h2>
      <p class="result-count">{{ move.cards.length }} Pokémon</p>
      <app-pokemon-cards [cards]="move.cards" />
    </section>
  } @else {
    <app-not-found-message />
  }
</main>
