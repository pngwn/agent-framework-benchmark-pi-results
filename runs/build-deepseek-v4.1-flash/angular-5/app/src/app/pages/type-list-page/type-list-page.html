<main class="page">
  <h1 class="page-title">Types</h1>
  <ul class="type-grid" role="list">
    @for (type of pageData()?.types ?? []; track type.name) {
      <li>
        <a
          [class]="'type-badge type-grid__link badge--' + type.name"
          [routerLink]="['/types', type.name]"
        >
          {{ type.displayName }}
        </a>
      </li>
    }
  </ul>
</main>
