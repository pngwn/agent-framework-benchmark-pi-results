<main class="page">
  @if (pageData(); as ability) {
    <h1 class="page-title">{{ ability.displayName }}</h1>

    <section class="panel" aria-labelledby="effect-heading">
      <h2 id="effect-heading">Effect</h2>
      <p>{{ ability.effect }}</p>
    </section>

    <section class="panel" aria-labelledby="pokemon-heading">
      <h2 id="pokemon-heading">Pokémon</h2>
      <p class="result-count">{{ ability.cards.length }} Pokémon</p>
      <app-pokemon-cards [cards]="ability.cards" />
    </section>
  } @else {
    <app-not-found-message />
  }
</main>
