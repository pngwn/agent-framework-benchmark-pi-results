<main class="page">
  <h1 class="page-title">Pokémon</h1>

  <div class="filter-bar">
    <div class="field field--search">
      <label for="pokemon-search">Search</label>
      <input
        id="pokemon-search"
        type="search"
        [value]="q()"
        (input)="onSearchInput($event)"
        autocomplete="off"
      />
    </div>
    <div class="field">
      <label for="type-filter">Type</label>
      <select id="type-filter" [value]="typeFilter()" (change)="onTypeChange($event)">
        <option value="">All types</option>
        @for (type of types(); track type.name) {
          <option [value]="type.name">{{ type.displayName }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="generation-filter">Generation</label>
      <select
        id="generation-filter"
        [value]="generationFilter()"
        (change)="onGenerationChange($event)"
      >
        <option value="">All generations</option>
        @for (generation of generations(); track generation.name) {
          <option [value]="generation.name">{{ generation.label }}</option>
        }
      </select>
    </div>
  </div>

  <p class="result-count">{{ filteredSpecies().length }} Pokémon</p>

  @if (filteredSpecies().length) {
    <app-pokemon-cards [cards]="pageCards()" [showTypes]="true" />

    <div class="pagination">
      <span>Page {{ pageNumber() }} of {{ totalPages() }}</span>
      @if (pageNumber() > 1) {
        <a routerLink="/" [queryParams]="pageParams(pageNumber() - 1)">Previous page</a>
      }
      @if (pageNumber() < totalPages()) {
        <a routerLink="/" [queryParams]="pageParams(pageNumber() + 1)">Next page</a>
      }
    </div>
  } @else {
    <p class="empty-state">No Pokémon found</p>
  }
</main>
