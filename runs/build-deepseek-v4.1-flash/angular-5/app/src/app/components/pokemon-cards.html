<ul class="card-grid" role="list">
  @for (card of cards(); track card.id) {
    <li class="pokemon-card" role="listitem">
      <a class="pokemon-card__link" [routerLink]="['/pokemon', card.speciesName]">
        <img
          class="pokemon-card__sprite"
          [src]="card.spriteUrl"
          [alt]="''"
          width="96"
          height="96"
          loading="lazy"
        />
        <span class="pokemon-card__dex">{{ card.dex }}</span>
        <span class="pokemon-card__name">{{ card.displayName }}</span>
      </a>
      @if (showTypes() && card.types.length) {
        <span class="type-badges">
          @for (type of card.types; track type.name) {
            <span [class]="'type-badge badge--' + type.name">{{ type.displayName }}</span>
          }
        </span>
      }
      @if (card.hiddenAbility) {
        <span class="hidden-ability">Hidden ability</span>
      }
    </li>
  }
</ul>
