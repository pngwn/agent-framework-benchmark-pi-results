<a class="pokemon-card" [routerLink]="['/pokemon', speciesName()]">
  <span class="sprite-wrap">
    <img
      [src]="spriteUrl()"
      alt=""
      width="96"
      height="96"
      loading="lazy"
      (error)="onImageError($event)"
    />
  </span>
  <span class="dex">{{ dex() }}</span>
  <span class="name">{{ displayName() }}</span>
  @if (types().length) {
    <span class="type-badges">
      @for (type of types(); track type.name) {
        <span class="type-badge" [class]="'type-badge type-' + type.name">{{ type.displayName }}</span>
      }
    </span>
  }
</a>
@if (hiddenAbility()) {
  <span class="hidden-ability">Hidden ability</span>
}
