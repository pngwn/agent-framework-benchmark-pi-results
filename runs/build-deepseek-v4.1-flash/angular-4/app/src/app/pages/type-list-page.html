<h1>Types</h1>

@if (types(); as types) {
  <ul class="type-list">
    @for (type of types; track type.name) {
      <li>
        <a class="type-link" [class]="'type-link type-' + type.name" [routerLink]="['/types', type.name]">
          {{ type.displayName }}
        </a>
      </li>
    }
  </ul>
} @else {
  <p class="loading">Loading…</p>
}
