@if (ability() === undefined || (ability() && species() === null)) {
  <p class="loading">Loading…</p>
} @else if (ability()) {
  <h1>{{ displayName() }}</h1>

  <section class="panel" aria-labelledby="effect-heading">
    <h2 id="effect-heading">Effect</h2>
    <p>{{ effectText() }}</p>
  </section>

  <section class="panel" aria-labelledby="pokemon-heading">
    <h2 id="pokemon-heading">Pokémon</h2>
    <p class="count">{{ pokemon().length }} Pokémon</p>
    <ul class="card-grid">
      @for (entry of pokemon(); track entry.id) {
        <app-pokemon-card
          [speciesName]="entry.name"
          [pokemonId]="entry.id"
          [hiddenAbility]="entry.hidden"
        />
      }
    </ul>
  </section>
} @else {
  <app-not-found />
}
